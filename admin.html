  <script>

    const supabaseClient =
      window.supabase.createClient(

    /* ---------- Elements ---------- */

    const loginSection =
      document.getElementById('login-section');

    const dashboardSection =
      document.getElementById('dashboard-section');

    const loginForm =
      document.getElementById('login-form');

    const loginMessage =
      document.getElementById('login-message');

    const logoutButton =

    /* ---------- Authentication ---------- */

    async function checkUser() {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (user) {
        showDashboard();
      } else {
        showLogin();
      }
    }


    function showDashboard() {

      loginSection.hidden = true;
      dashboardSection.hidden = false;

      loadAdminJobs();

    function showLogin() {

      loginSection.hidden = false;
      dashboardSection.hidden = true;

    /* ---------- Login ---------- */

    loginForm.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault();

        loginMessage.textContent =
          'Signing in...';

        const email =
          document.getElementById(
            'login-email'
          ).value.trim();

        const password =
          document.getElementById(
            'login-password'
          ).value;


        const { error } =
          await supabaseClient.auth

              password
            });


        if (error) {

          loginMessage.textContent =

          return;

        loginMessage.textContent = '';

/* ---------- Add / Edit Job ---------- */

jobForm.addEventListener(
  'submit',
  async (event) => {

    event.preventDefault();

    formMessage.textContent =
      jobForm.dataset.editingId
        ? 'Saving changes...'
        : 'Publishing...';


    const jobData = {

      title:
        document.getElementById('title')
          .value.trim(),

      company:
        document.getElementById('company')
          .value.trim(),

      source:
        document.getElementById('source')
          .value.trim(),

      source_url:
        document.getElementById('source_url')
          .value.trim(),

      pay:
        document.getElementById('pay')
          .value.trim(),

      location:
        document.getElementById('location')
          .value.trim(),

      job_type:
        document.getElementById('job_type')
          .value,

      category:
        document.getElementById('category')
          .value.trim(),

      description:
        document.getElementById('description')
          .value.trim()
    };


    const editingId =
      jobForm.dataset.editingId;


    let error;


    if (editingId) {

      const result =
        await supabaseClient
          .from('jobs')
          .update(jobData)
          .eq('id', editingId);

      error = result.error;

    } else {

      const result =
        await supabaseClient
          .from('jobs')
          .insert({
            ...jobData,
            posted_at:
              new Date().toISOString(),
            status:
              'pending'
          });

      error = result.error;
    }


    if (error) {

      console.error(error);

      formMessage.textContent =
        editingId
          ? 'Error saving changes.'
          : 'Error publishing job.';

      return;
    }


    formMessage.textContent =
      editingId
        ? 'Job updated successfully!'
        : 'Job published successfully!';


    jobForm.reset();

    delete jobForm.dataset.editingId;

    jobForm.querySelector(
      'button[type="submit"]'
    ).textContent =
      'Publish Job';


    loadAdminJobs();
  }
);


    /* ---------- Load Existing Jobs ---------- */

    async function loadAdminJobs() {

      jobsList.innerHTML =
        '<p>Loading jobs...</p>';


      const {
        data,
        error
      } = await supabaseClient
        .from('jobs')
        .select('*')
        .order(
          'created_at',
          { ascending: false }
        );


      if (error) {

        console.error(
          'Error loading admin jobs:',
          error
        );

        jobsList.innerHTML =
          '<p>Could not load jobs.</p>';

        return;
      }


      if (!data || data.length === 0) {

        jobsList.innerHTML =
          '<p>No jobs found.</p>';

        return;
      }


      jobsList.innerHTML =
        data.map(job => `

          <article class="admin-job">

            <h3>
              ${escapeHTML(job.title)}
            </h3>

            <p>
              ${escapeHTML(
                job.company || 'No company'
              )}
              ·
              ${escapeHTML(
                job.source || 'Unknown source'
              )}
            </p>

            <p>
              Status:
              <strong>
                ${escapeHTML(job.status)}
              </strong>
            </p>

            <p>
              ${escapeHTML(
                job.pay || 'Pay not specified'
              )}
              ·
              ${escapeHTML(
                job.location ||
                'Location not specified'
              )}
            </p>

<div class="admin-job-actions">

  <button
    type="button"
    data-edit-job="${job.id}"
  >
    Edit Job
  </button>

  ${
    job.status === 'published'
      ? `
        <button
          type="button"
          data-expire-job="${job.id}"
        >
          Expire Job
        </button>
      `
      : ''
  }

  <button
    type="button"
    data-delete-job="${job.id}"
  >
    Delete Job
  </button>

</div>

          </article>

        `).join('');


      jobsList
        .querySelectorAll(
          '[data-expire-job]'
        )
        .forEach(button => {

          button.addEventListener(
            'click',
            () => {

              expireJob(
                button.dataset.expireJob
              );

            }
          );

        });
      jobsList
  .querySelectorAll('[data-edit-job]')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        editJob(
          button.dataset.editJob
        );

      }
    );

  });

      jobsList
  .querySelectorAll('[data-delete-job]')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        deleteJob(
          button.dataset.deleteJob
        );

      }
    );

  });
    }


    /* ---------- Escape HTML ---------- */

    function escapeHTML(value) {

      const div =
        document.createElement('div');

      div.textContent =
        value ?? '';

      return div.innerHTML;
    }

async function editJob(jobId) {

  const { data, error } = await supabaseClient
    .from('jobs')
    .select('*')
    .eq('id', jobId)
    .single();

  if (error) {
    console.error('Error loading job:', error);
    alert('Could not load this job.');
    return;
  }

  document.getElementById('title').value =
    data.title || '';

  document.getElementById('company').value =
    data.company || '';

  document.getElementById('source').value =
    data.source || '';

  document.getElementById('source_url').value =
    data.source_url || '';

  document.getElementById('pay').value =
    data.pay || '';

  document.getElementById('location').value =
    data.location || '';

  document.getElementById('job_type').value =
    data.job_type || 'Freelance';

  document.getElementById('category').value =
    data.category || '';

  document.getElementById('description').value =
    data.description || '';

  jobForm.dataset.editingId = jobId;

  jobForm.querySelector('button[type="submit"]').textContent =
    'Save Changes';

  formMessage.textContent =
    'Editing this job. Make your changes and save.';
}


    async function deleteJob(jobId) {

  const confirmed = confirm(
    'Are you sure you want to permanently delete this job? This cannot be undone.'
  );

  if (!confirmed) {
    return;
  }

  console.log('Trying to delete job ID:', jobId);

  const { data, error } = await supabaseClient
    .from('jobs')
    .delete()
    .eq('id', jobId)
    .select();

  console.log('Delete response:', data);
  console.log('Delete error:', error);

  if (error) {
    console.error('Error deleting job:', error);
    alert('Could not delete the job.');
    return;
  }

  if (!data || data.length === 0) {
    console.error('No job was deleted.');
    alert('No job was deleted. Check the Supabase DELETE policy.');
    return;
  }

  alert('Job deleted successfully!');

  loadAdminJobs();
}
    /* ---------- Expire Job ---------- */

    async function expireJob(jobId) {

  const confirmed = confirm(
    'Are you sure you want to expire this job?'
  );

  if (!confirmed) {
    return;
  }

  console.log('Trying to expire job ID:', jobId);

  const { data, error } = await supabaseClient
    .from('jobs')
    .update({
      status: 'expired'
    })
    .eq('id', jobId)
    .select();

  console.log('Expire response:', data);
  console.log('Expire error:', error);

  if (error) {
    console.error('Error expiring job:', error);
    alert('Could not expire the job.');
    return;
  }

  if (!data || data.length === 0) {
    console.error('No job was updated.');
    alert('No job was updated. Check the Supabase UPDATE policy.');
    return;
  }

  alert('Job expired successfully!');

  loadAdminJobs();
}


    /* ---------- Start ---------- */

    checkUser();

  </script>
